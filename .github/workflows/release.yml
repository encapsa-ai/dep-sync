name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app versions
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          lock_version="$(sed -n '/^name = "dep-sync"$/{n;s/^version = "\(.*\)"$/\1/p;q;}' src-tauri/Cargo.lock)"

          check_version() {
            local source="$1"
            local actual="$2"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$source::Expected version $expected for tag $GITHUB_REF_NAME, found $actual"
              return 1
            fi
          }

          check_version package.json "$package_version"
          check_version src-tauri/tauri.conf.json "$tauri_version"
          check_version src-tauri/Cargo.toml "$cargo_version"
          check_version src-tauri/Cargo.lock "$lock_version"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os: ubuntu-latest
            target: linux-x86_64
            args: --bundles appimage,deb
          - os: windows-latest
            target: windows-x86_64
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.target == 'universal-apple-darwin'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "dep-sync ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for release notes."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_flags=(--draft=false)
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then
            release_flags+=(--latest)
          fi
          gh release edit "$GITHUB_REF_NAME" "${release_flags[@]}"
